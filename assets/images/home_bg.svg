<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 1024" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main Background Vertical Gradient -->
    <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0047C7" />
      <stop offset="8%" stop-color="#0063E5" />
      <stop offset="18%" stop-color="#0A82F9" />
      <stop offset="30%" stop-color="#42A5F5" />
      <stop offset="42%" stop-color="#90CAF9" />
      <stop offset="52%" stop-color="#E3F2FD" />
      <stop offset="62%" stop-color="#F4F9FE" />
      <stop offset="80%" stop-color="#EAF4FE" />
      <stop offset="100%" stop-color="#C7E3FD" />
    </linearGradient>

    <!-- Top Graceful Wave Ribbon Gradients -->
    <linearGradient id="topWaveGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#70B8FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0055D4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="topWaveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0047C7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Central U-Curve Dip Ribbon Gradients -->
    <linearGradient id="midWaveAura" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#60A5FA" stop-opacity="0.40" />
      <stop offset="70%" stop-color="#0077F4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="midWaveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="25%" stop-color="#E0F2FE" stop-opacity="0.60" />
      <stop offset="65%" stop-color="#BAE6FD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="midWaveCrest" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.70" />
      <stop offset="25%" stop-color="#E0E7FF" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#BAE6FD" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="softGlowRadial" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. Base Gradient Canvas -->
  <rect width="472" height="1024" fill="url(#mainBgGrad)" />

  <!-- 2. Top Decorative Wave Ribbon -->
  <!-- Upper flowing wave path -->
  <path d="M 472 80 C 400 95, 320 145, 230 140 C 140 135, 60 175, 0 195 L 0 80 C 60 70, 150 75, 240 85 C 330 95, 410 75, 472 65 Z" fill="url(#topWaveGrad1)" />
  <path d="M 472 80 C 400 95, 320 145, 230 140 C 140 135, 60 175, 0 195" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.75" />
  <path d="M 472 105 C 390 125, 300 160, 200 155 C 100 150, 40 185, 0 205" fill="none" stroke="url(#topWaveGrad2)" stroke-width="2.2" />

  <!-- 3. Central Ambient Wave Aura -->
  <ellipse cx="236" cy="540" rx="240" ry="160" fill="url(#softGlowRadial)" />

  <!-- 4. Lower Sweeping Wave (Translucent under-ribbon) -->
  <path d="M -20 520 C 80 545, 170 610, 250 610 C 330 610, 400 560, 492 485 L 492 560 C 410 630, 320 670, 240 665 C 160 660, 70 600, -20 575 Z" fill="url(#midWaveAura)" opacity="0.65" />

  <!-- 5. Main U-Curve Ribbon Body (Curving down and scooping up) -->
  <path d="M -10 500 C 70 525, 150 598, 240 599 C 330 600, 410 545, 482 485 L 482 660 C 390 710, 290 720, 200 700 C 110 680, 40 640, -10 620 Z" fill="url(#midWaveFill)" />

  <!-- 6. Secondary Lilac/Sky Sheen on left flank -->
  <path d="M -10 505 C 50 525, 110 575, 170 590 C 130 595, 60 575, -10 540 Z" fill="#818CF8" opacity="0.35" />

  <!-- 7. Crisp High-Precision Wave Crest Highlight Lines -->
  <!-- Main white light reflection line -->
  <path d="M -10 500 C 70 526, 150 598, 240 599 C 330 600, 410 545, 482 485" fill="none" stroke="url(#midWaveCrest)" stroke-width="2.2" stroke-linecap="round" />
  <!-- Delicate luminous echo line just above crest -->
  <path d="M -10 496 C 70 522, 150 594, 240 595 C 330 596, 410 541, 482 481" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.70" stroke-linecap="round" />
  <!-- Underglow subtle cyan edge -->
  <path d="M 40 540 C 120 590, 190 616, 260 615 C 330 614, 390 580, 482 505" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.55" />
</svg>